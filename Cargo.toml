[package]
name = "yaml-seeder"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/quantum-box/yaml-seeder"
description = "A CLI for applying and exporting YAML seed data to MySQL-compatible databases."

[dependencies]
anyhow = "1"
bigdecimal = "0.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "mysql", "chrono", "bigdecimal"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serial_test = "2"
tempfile = "3"
